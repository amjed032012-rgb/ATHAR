name: Compile and Release Android App APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v5

    - name: Setup Java Development Kit
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Prepare Application Files
      run: |
        mkdir -p app_source
        if [ -f "index.html" ]; then
          cp -r * app_source/ 2>/dev/null || true
        elif [ -d "www" ]; then
          cp -r www/* app_source/
        else
          echo "<h1>Application Successfully Launched</h1><p>Compiled natively via GitHub Actions.</p>" > app_source/index.html
        fi

    - name: Download Standalone App Compiler
      run: |
        wget -O web-to-app-linux https://github.com
        chmod +x web-to-app-linux

    - name: Run Standalone App Compiler
      run: |
        ./web-to-app-linux --input ./app_source --output ./final-app.apk --name "My GitHub App"

    - name: Distribute APK to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: final-app.apk
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Ultimate Native Android App Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-android-app:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v5

    - name: Set up System Java Development Kit
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Initialize Android SDK Environment
      run: |
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        mkdir -p project/app/src/main/res/layout
        mkdir -p project/app/src/main/res/values
        mkdir -p project/app/src/main/java/com/universal/app

    - name: Auto-Generate Core Project Structure
      run: |
        cat << 'EOF' > project/settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "UniversalApp"
        include ':app'
        EOF

    - name: Auto-Generate Gradle Root Configurations
      run: |
        cat << 'EOF' > project/build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'com.android.library' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
        }
        EOF

    - name: Auto-Generate Mobile App Configuration
      run: |
        cat << 'EOF' > project/app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.universal.app'
            compileSdk 34
            defaultConfig {
                applicationId "com.universal.app"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0.0"
            }
            buildTypes {
                release {
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
        }
        EOF

    - name: Auto-Generate App Android Manifest
      run: |
        cat << 'EOF' > project/app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com">
            <application
                android:allowBackup="true"
                android:icon="@android:drawable/sym_def_app_icon"
                android:label="GitHub Universal App"
                android:roundIcon="@android:drawable/sym_def_app_icon"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    - name: Auto-Generate App String Configurations
      run: |
        cat << 'EOF' > project/app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">GitHub Universal App</string>
        </resources>
        EOF

    - name: Auto-Generate Native Application UI Layout
      run: |
        cat << 'EOF' > project/app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <RelativeLayout xmlns:android="http://android.com"
            android:layout_width="match_match"
            android:layout_height="match_parent"
            android:background="#FAFAFA">
            <LinearLayout
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:centerInParent="true"
                android:orientation="vertical"
                android:gravity="center">
                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="Build Completed Successfully!"
                    android:textColor="#2E7D32"
                    android:textSize="24sp"
                    android:textStyle="bold" />
                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:layout_marginTop="8dp"
                    android:text="Your repository app is alive and functional."
                    android:textColor="#555555"
                    android:textSize="14sp" />
            </LinearLayout>
        </RelativeLayout>
        EOF

    - name: Auto-Generate Java Main Activity Logic
      run: |
        cat << 'EOF' > project/app/src/main/java/com/universal/app/MainActivity.java
        package com.universal.app;
        import android.os.Bundle;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);
            }
        }
        EOF

    - name: Setup Wrapper and Build Native System
      run: |
        cd project
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Verify Compiled Artifact Output
      run: |
        if [ ! -f "project/app/build/outputs/apk/debug/app-debug.apk" ]; then
          echo "Compilation Failure: Output APK file not generated."
          exit 1
        fi

    - name: Package and Publish Compiled Binary to Releases
      uses: softprops/action-gh-release@v2
      with:
        files: project/app/build/outputs/apk/debug/app-debug.apk
        tag_name: v1.0.${{ github.run_number }}
        name: Build Production App Release v1.0.${{ github.run_number }}
        body: |
          ### Automated Mobile Build Completed
          - **File Status:** Production APK verification passed.
          - **Build Identifier:** GitHub Action Pipeline run #${{ github.run_number }}
          
          Download the raw application asset attached below to install directly on your Android hardware device.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

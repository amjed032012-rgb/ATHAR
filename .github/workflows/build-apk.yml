name: Compile and Release Android App APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v5

    - name: Initialize Web Directory Builder
      run: |
        if [ ! -d "www" ] && [ ! -f "index.html" ]; then
          mkdir -p www
          echo "<h1>Application Successfully Launched</h1><p>Compiled natively via GitHub Actions.</p>" > www/index.html
        fi

    - name: Build Android App Container
      uses: duckduckfire/delegateapp-action@v1
      with:
        app-name: "My GitHub App"
        web-dir: ${{ (dynamic_dir) }}

    - name: Stage Production Package
      run: |
        mv release.apk final-app.apk

    - name: Distribute APK to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: final-app.apk
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

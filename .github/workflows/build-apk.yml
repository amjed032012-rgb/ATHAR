name: Build and Release App APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Convert Project to APK
      uses: Jipok/website-to-apk@v2
      with:
        app-name: "My GitHub App"
        package-name: "com.mygithubapp.app"
        output-apk-path: "my-compiled-app.apk"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: my-compiled-app.apk
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
